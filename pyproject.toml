[project]
name = "procedure_tools"
dynamic = ["version"]
description = "CLI tools for creating Prozorro CDB procedures"
readme = "README.md"
keywords = ["prozorro", "procurement"]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.10"
dependencies = [
    "faker",
    "jinja2",
    "jsonpath-ng",
    "python-dateutil",
    "requests",
]

[project.optional-dependencies]
color = [
    "colorama",
    "pygments",
]
test = [
    "pytest",
]
dev = [
    "mypy",
    "pylint",
    "pylint-pytest",
    "ruff",
    "types-Pygments",
    "types-python-dateutil",
    "types-requests",
]

[project.scripts]
procedure-tools = "procedure_tools.main:main"
procedure = "procedure_tools.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "procedure_tools.version.__version__"}

[tool.setuptools.packages.find]
include = ["procedure_tools*"]
namespaces = true

[tool.setuptools.package-data]
procedure_tools = ["data/**/*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
minversion = "6.0"
python_files = [
    "procedure_tools/test.py",
    "test_*.py",
]
testpaths = [
    "procedure_tools",
]
norecursedirs = [
    "__pycache__",
    ".git",
    ".eggs",
    "*.egg",
]
addopts = "-v --color=yes -rs"
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "[%(asctime)s] %(message)s"
log_cli_date_format = "%H:%M:%S"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["procedure_tools"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "colorama.*",
    "jsonpath_ng.*",
]
ignore_missing_imports = true

[tool.pylint]
[tool.pylint.main]
jobs = 1
load-plugins = [
    "pylint_pytest",
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "duplicate-code",
    "line-too-long",
    "logging-fstring-interpolation",
    "logging-not-lazy",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-positional-arguments",
    "too-many-return-statements",
    "too-many-statements",
]

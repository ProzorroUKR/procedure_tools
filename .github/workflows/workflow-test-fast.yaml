name: Fast Test Workflow

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  extract-test-cases:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.get-cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Extract workflow test cases from test.py
        id: get-cases
        run: |
          python .github/scripts/export_workflow_test_cases.py

  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black
      - name: Run black
        run: |
          black . --check

  pytest-unit:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v6
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run unit tests
        run: |
          pytest procedure_tools/ --ignore=procedure_tools/test.py

  pytest-fast:
    needs: extract-test-cases
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.extract-test-cases.outputs.cases) }}
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v6
      - name: Setup timezone
        run: sudo timedatectl set-timezone Europe/Kyiv
      - name: Set up python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Run pytest
        env:
          FAST_RUN: 1
          API_HOST: ${{ secrets.API_HOST }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          DS_HOST: ${{ secrets.DS_HOST }}
          DS_USERNAME: ${{ secrets.DS_USERNAME }}
          DS_PASSWORD: ${{ secrets.DS_PASSWORD }}
          REVIEWER_TOKEN: ${{ secrets.REVIEWER_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python .github/scripts/write_test_env.py
          pytest procedure_tools/test.py::test_${{ matrix.case }}

  pytest-python-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        installer: [pip, uv]
    env:
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v6
      - name: Setup timezone
        run: sudo timedatectl set-timezone Europe/Kyiv
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"
      - name: Install uv
        if: matrix.installer == 'uv'
        uses: astral-sh/setup-uv@v6
      - name: Install with uv
        if: matrix.installer == 'uv'
        run: uv sync --extra test --active
      - name: Install with pip
        if: matrix.installer == 'pip'
        run: pip install -e .[test]
      - name: Run pytest
        env:
          FAST_RUN: 1
          API_HOST: ${{ secrets.API_HOST }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          DS_HOST: ${{ secrets.DS_HOST }}
          DS_USERNAME: ${{ secrets.DS_USERNAME }}
          DS_PASSWORD: ${{ secrets.DS_PASSWORD }}
          REVIEWER_TOKEN: ${{ secrets.REVIEWER_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python .github/scripts/write_test_env.py
          pytest procedure_tools/test.py::test_below_threshold
